name: Lint

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# IMPORTANT: Keep HA_VERSION synchronized across all workflow files:
# - copilot-setup-steps.yml
# - lint.yml
# - validate.yml (if added in the future)

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.11.12"

      - name: Get Home Assistant version
        id: ha_version
        run: |
          version=$(bash script/.lib/ha_version.sh)
          echo "HA_VERSION=${version}" >>"$GITHUB_OUTPUT"

      - name: Cache Home Assistant installation
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .local/ha-venv
          key: ha-venv-v2-${{ runner.os }}-ha${{ steps.ha_version.outputs.HA_VERSION }}-${{ hashFiles('mise.toml', '.config/mise/conf.d/*.toml', '**/requirements*.txt') }}
          restore-keys: |
            ha-venv-v2-${{ runner.os }}-ha${{ steps.ha_version.outputs.HA_VERSION }}-
            ha-venv-v2-${{ runner.os }}-

      - name: Install shfmt
        run: sudo apt-get install -y shfmt

      - name: Install requirements
        run: script/setup/bootstrap

      - name: Lint check
        run: script/lint-check
